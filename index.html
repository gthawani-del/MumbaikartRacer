<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071319" />
    <meta name="description" content="Mumbai Auto Rush — a cinematic browser racing prototype." />
    <title>Mumbai Auto Rush</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Mumbai Auto Rush 3D game"></canvas>

      <section class="boot" id="boot">
        <div class="boot__eyebrow">CINEMATIC WEB RACING PROTOTYPE</div>
        <h1>MUMBAI<br /><span>AUTO RUSH</span></h1>
        <p>Blue hour. Wet roads. Full throttle.</p>
        <button id="start" type="button">
          <span>START ENGINE</span>
          <small>Best experienced with sound</small>
        </button>
        <div class="boot__controls">WASD / ARROWS TO DRIVE&nbsp;&nbsp;·&nbsp;&nbsp;SPACE TO DRIFT</div>
      </section>

      <div class="loading" id="loading">
        <div class="loading__line"><i></i></div>
        <span>BUILDING THE MAXIMUM CITY</span>
      </div>

      <section class="hud" id="hud" aria-live="polite">
        <div class="hud__top">
          <div class="brand">MUMBAI <span>AUTO RUSH</span></div>
          <div class="prototype">CINEMATIC PROTOTYPE · 01</div>
        </div>
        <div class="district">
          <span id="district">MARINE DRIVE</span>
          <small>मुंबई</small>
        </div>
        <div class="speed">
          <strong id="speed">000</strong>
          <span>KM/H</span>
          <div class="boost"><i id="boost"></i></div>
        </div>
        <button class="skip" id="skip" type="button">TAKE CONTROL</button>
      </section>

      <section class="mobile-controls" id="mobile-controls" aria-label="Mobile driving controls">
        <div class="steer">
          <button data-control="left" aria-label="Steer left">‹</button>
          <button data-control="right" aria-label="Steer right">›</button>
        </div>
        <button class="drift" data-control="drift">DRIFT</button>
      </section>

      <div class="film-grain" aria-hidden="true"></div>
      <div class="letterbox letterbox--top" aria-hidden="true"></div>
      <div class="letterbox letterbox--bottom" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
